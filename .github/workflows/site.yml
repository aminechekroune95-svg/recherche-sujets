name: Collecte des sujets et publication

on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  schedule:
    - cron: "23 2 * * 1" # chaque lundi vers 3 h (heure de Paris) : nouveaux sujets
  workflow_dispatch:
    inputs:
      collect:
        description: "Collecter ccbac.fr (listes, fiches, PDF)"
        type: boolean
        default: true
      skip_lists:
        description: "Réutiliser les listes déjà collectées"
        type: boolean
        default: false
      minutes:
        description: "Budget de temps de collecte (minutes)"
        default: "300"
      only:
        description: "Codes matière à traiter (vide = toutes), ex. 1,30"
        default: ""
      chain:
        description: "Relance automatique n° (ne pas modifier)"
        default: "0"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: collecte-et-site
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect)
    runs-on: ubuntu-latest
    timeout-minutes: 345
    outputs:
      remaining: ${{ steps.crawl.outputs.remaining }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - name: Outils PDF et OCR
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils tesseract-ocr tesseract-ocr-fra
      - name: Collecte
        id: crawl
        run: >
          python scraper/crawl.py --data data
          --max-minutes "${{ inputs.minutes || '300' }}"
          ${{ inputs.skip_lists && '--skip-lists' || '' }}
          ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
      - name: Enregistrer les données (branche data)
        if: ${{ !cancelled() }}
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Données $(date -u +%Y-%m-%dT%H:%MZ)" || echo "Rien de nouveau"
          git push -q origin HEAD:data

  deploy:
    needs: collect
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Index de recherche
        run: node scripts/build.mjs --data data --out dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  relaunch:
    needs: [collect, deploy]
    if: ${{ !cancelled() && needs.collect.result == 'success' && needs.collect.outputs.remaining != '' && needs.collect.outputs.remaining != '0' && fromJSON(inputs.chain || '0') < 15 }}
    runs-on: ubuntu-latest
    steps:
      # Relances courtes (70 min) : le site est republié après chacune, il se remplit au fur et à mesure.
      - name: Continuer la lecture des PDF restants
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh workflow run site.yml -R "${{ github.repository }}" --ref main
          -f collect=true -f skip_lists=true -f minutes=70
          -f chain=$(( ${{ inputs.chain || '0' }} + 1 ))
